name: Release

# Publishes to crates.io when a version tag such as v0.1.1 is pushed. crates.io trusts this workflow
# (Trusted Publishing), so no token is stored in the repository.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Check that the tag matches the crate's version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "mison") | .version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME is not v$version"; exit 1; }
      - run: mise run check
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # mison-derive first, as mison depends on it. A version already on crates.io is skipped, so a release
      # that leaves mison-derive unchanged publishes only mison.
      - name: Publish the crates whose versions are not on crates.io yet
        run: |
          for crate in mison-derive mison; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            if curl -sf "https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate" | grep -qF "\"vers\":\"$version\""; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish -p "$crate"
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
