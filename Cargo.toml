[package]
name = "mison"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Minimal and simple object notation: JSON-like, token-efficient yet human-friendly"
repository = "https://github.com/takagiy/mison"
readme = "README.md"
keywords = ["serialization", "format"]
categories = ["encoding"]

[dependencies]
itoa = "1"
ryu = "1"
mison-derive = { version = "0.2.0", path = "mison-derive" }

[workspace]
members = ["mison-derive"]
