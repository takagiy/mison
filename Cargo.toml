[package]
name = "mison"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Minimal and simple object notation: a compact text format for serde, read back through the types it was written from"
repository = "https://github.com/takagiy/mison"
readme = "README.md"
keywords = ["serde", "serialization", "format"]
categories = ["encoding"]

[dependencies]
serde = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
