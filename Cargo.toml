[package]
name = "mison"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "Minimal and simple object notation: JSON-like, token-efficient yet human-friendly"
repository = "https://github.com/takagiy/mison"
readme = "README.md"
keywords = ["serde", "serialization", "format"]
categories = ["encoding"]

[dependencies]
serde = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
